[package]
name = "ccync-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "ccync_engine"
path = "src/lib.rs"

[dependencies]
ccync-foundation = { path = "../ccync-foundation" }
projection = { path = "../projection" }
mcp = { path = "../mcp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", features = ["parse"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
regex = "1.0"
sha2 = "0.10"
hex = "0.4"
semver = "1.0"
zip = "2.1"
flate2 = "1.0"
tar = "0.4"
pep440_rs = "0.7"
serde_yaml_ng = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.0"
